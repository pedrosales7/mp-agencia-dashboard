<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Playground v2 — Análise IA MP Agência (pipeline 3 estágios)</title>
<style>
  :root { --bd:#dde2e8; --bg:#fff; --fg:#1c2733; --mut:#6b7785; --acc:#1e6fd9; --warn:#b8860b; --err:#c0392b; --ok:#1e8449; --panel:#f7f9fc; }
  @media (prefers-color-scheme:dark) {
    :root { --bd:#2b323e; --bg:#151a21; --fg:#e6e9ef; --mut:#8b95a3; --acc:#5b9bf5; --warn:#d4a017; --err:#e74c3c; --ok:#2ecc71; --panel:#1b212a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 16px; border-bottom:1px solid var(--bd); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:1rem; margin:0; white-space:nowrap; }
  label { font-size:.78rem; color:var(--mut); display:block; margin-bottom:2px; }
  select, input[type=text], input[type=password] { padding:5px 7px; border:1px solid var(--bd); border-radius:5px; background:var(--bg); color:var(--fg); font-size:.82rem; }
  button { padding:6px 13px; border:0; border-radius:5px; background:var(--acc); color:#fff; font-weight:600; cursor:pointer; font-size:.85rem; }
  button.secondary { background:transparent; color:var(--mut); border:1px solid var(--bd); font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:0; height:calc(100vh - 52px); }
  .col { display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--bd); }
  .col:last-child { border-right:0; }
  .tabs { display:flex; gap:2px; padding:6px 10px 0; border-bottom:1px solid var(--bd); overflow-x:auto; }
  .tabs button { background:transparent; color:var(--mut); border:0; border-bottom:2px solid transparent; border-radius:0; padding:5px 9px; font-size:.78rem; font-weight:500; white-space:nowrap; }
  .tabs button.active { color:var(--acc); border-bottom-color:var(--acc); }
  .pane { flex:1; overflow:auto; display:none; }
  .pane.active { display:block; }
  textarea { width:100%; height:100%; border:0; padding:10px 12px; resize:none; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; background:transparent; color:var(--fg); outline:none; }
  pre { margin:0; padding:10px 12px; font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; word-break:break-word; }
  .status { padding:6px 14px; border-top:1px solid var(--bd); font-size:.78rem; color:var(--mut); min-height:28px; }
  .status.error { color:var(--err); }
  .spinner { display:inline-block; width:10px; height:10px; border:2px solid var(--bd); border-top-color:var(--acc); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-1px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .steps { display:flex; gap:6px; padding:6px 14px; font-size:.74rem; color:var(--mut); border-top:1px solid var(--bd); flex-wrap:wrap; }
  .steps span { padding:2px 7px; border:1px solid var(--bd); border-radius:10px; }
  .steps span.run { border-color:var(--acc); color:var(--acc); }
  .steps span.done { border-color:var(--ok); color:var(--ok); }
  .steps span.fail { border-color:var(--err); color:var(--err); }
  table.tri { border-collapse:collapse; width:100%; font-size:.78rem; }
  table.tri th, table.tri td { border:1px solid var(--bd); padding:4px 7px; text-align:left; }
  table.tri th { background:var(--panel); position:sticky; top:0; }
  .b-alarme { color:var(--err); font-weight:700; }
  .b-atencao { color:var(--warn); font-weight:600; }
  .b-ok { color:var(--ok); }
  .b-outro { color:var(--mut); }
  .chk { padding:10px 14px; }
  .chk div { padding:3px 0; font-size:.82rem; }
  .chk .pass::before { content:"OK  "; color:var(--ok); font-weight:700; }
  .chk .fail::before { content:"X   "; color:var(--err); font-weight:700; }
  .chk .warn::before { content:"!   "; color:var(--warn); font-weight:700; }
  .chk h4 { margin:14px 0 4px; font-size:.8rem; text-transform:uppercase; letter-spacing:.4px; color:var(--mut); }
  .placeholder { padding:20px; color:var(--mut); font-size:.85rem; }
  iframe { width:100%; height:100%; border:0; background:transparent; }
  .hint { font-size:.72rem; color:var(--mut); padding:4px 12px 0; }
</style>
</head>
<body>

<header>
  <h1>Playground v2 — pipeline 3 estágios</h1>
  <div><label>provider</label>
    <select id="provider">
      <option value="gemini" selected>gemini</option>
      <option value="openai">openai</option>
      <option value="anthropic">anthropic</option>
    </select></div>
  <div><label>modelo</label>
    <input id="model" type="text" value="gemini-3.1-pro" list="modelos" size="20">
    <datalist id="modelos">
      <option>gemini-3.1-pro</option><option>gemini-2.5-flash</option><option>gemini-2.5-pro</option>
      <option>gpt-4o</option><option>claude-opus-5</option><option>claude-sonnet-5</option>
    </datalist></div>
  <div><label>API key</label><input id="apikey" type="password" placeholder="cole sua chave" autocomplete="off" size="22"></div>
  <div><label><input type="checkbox" id="rememberKey" style="width:auto"> lembrar</label></div>
  <button class="secondary" id="resetBtn" title="Volta prompts e payload ao padrão">&#8635; Resetar</button>
  <button class="secondary" id="run1Btn" title="Roda só triagem + estágio 1">&#9655; Só estágio 1</button>
  <button id="runBtn">&#9655;&#9655; Rodar tudo</button>
</header>

<main>
  <div class="col">
    <div class="tabs" id="inTabs">
      <button class="active" data-pane="p-e1">Prompt estágio 1</button>
      <button data-pane="p-e2">Prompt estágio 2</button>
      <button data-pane="p-pay">Payload</button>
      <button data-pane="p-prev">Diagnóstico anterior</button>
      <button data-pane="p-final">Prompt final enviado</button>
    </div>
    <div class="pane active" id="p-e1"><textarea id="promptE1" spellcheck="false"></textarea></div>
    <div class="pane" id="p-e2"><textarea id="promptE2" spellcheck="false"></textarea></div>
    <div class="pane" id="p-pay"><textarea id="payloadText" spellcheck="false"></textarea></div>
    <div class="pane" id="p-prev">
      <div class="hint">JSON do estágio 1 de uma semana anterior. Vazio = primeira semana (o bloco de continuidade sai). O último run fica salvo — use o botão abaixo.</div>
      <div style="padding:6px 12px"><button class="secondary" id="useLastBtn">usar diagnóstico do run anterior</button></div>
      <textarea id="prevText" spellcheck="false" style="height:calc(100% - 70px)"></textarea>
    </div>
    <div class="pane" id="p-final"><pre id="finalPrompt" class="placeholder">Rode para ver o prompt final.</pre></div>
    <div class="steps" id="steps">
      <span id="s0">0 · triagem</span><span id="s1">1 · diagnóstico</span><span id="s2">2 · redação</span><span id="sv">validação</span>
    </div>
  </div>

  <div class="col">
    <div class="tabs" id="outTabs">
      <button class="active" data-pane="o-tri">Triagem</button>
      <button data-pane="o-diag">Diagnóstico JSON</button>
      <button data-pane="o-rel">Relatório</button>
      <button data-pane="o-slack">Slack</button>
      <button data-pane="o-chk">Validação</button>
      <button data-pane="o-raw">Raw</button>
    </div>
    <div class="pane active" id="o-tri"><div class="placeholder">Rode para ver a triagem.</div></div>
    <div class="pane" id="o-diag"><div class="placeholder">—</div></div>
    <div class="pane" id="o-rel"><div class="placeholder">—</div></div>
    <div class="pane" id="o-slack"><div class="placeholder">—</div></div>
    <div class="pane" id="o-chk"><div class="placeholder">—</div></div>
    <div class="pane" id="o-raw"><div class="placeholder">—</div></div>
    <div class="status" id="status"></div>
  </div>
</main>

// ESTÁGIO 0 — TRIAGEM
// Espelho de ai_analysis.triar() (scripts/ai_analysis.py). O Python é a fonte
// da verdade desde 2026-07-24 — mudou lá, muda aqui.

const META = { CAC_IDEAL:150, CAC_ALARME:200, CPL_META:100, CPL_ALARME:200,
               MIN_VENDAS:3, MIN_LEADS:10, RAMP_DIAS:14 };

const SEV = { alarme:0, atencao:1, dado_suspeito:2, sem_base:3, ramp:4, ok:5 };

function gargaloRelevante(g) {
  if (!g) return false;
  return [g.desvio_vs_pares_pct, g.delta_vs_historico_pct]
    .some(d => d !== null && d !== undefined && d <= -15);
}

function escada(liq, leads, vendas, cac, cpl, leads7, dias) {
  const r = (s,m,b) => ({ status:s, motivo:m, base:b });
  if (!liq && !leads) return r("sem_base", "sem investimento nem lead em 30d", "nenhuma");
  if (dias < META.RAMP_DIAS) return r("ramp", `conta com ${dias} dias de dados (ramp de ${META.RAMP_DIAS})`, "ramp");
  if (liq > 0 && !leads && !leads7) return r("dado_suspeito", "investimento em 30d sem nenhum lead em 7d e 30d", "nenhuma");
  if (vendas >= META.MIN_VENDAS && cac != null) {
    if (cac <= META.CAC_IDEAL)  return r("ok",      `CAC 30d R$${Math.round(cac)} dentro do ideal`, "cac");
    if (cac <= META.CAC_ALARME) return r("atencao", `CAC 30d R$${Math.round(cac)} na zona de alerta (150-200)`, "cac");
    return r("alarme", `CAC 30d R$${Math.round(cac)} acima do teto de R$200`, "cac");
  }
  if (leads >= META.MIN_LEADS && cpl != null) {
    const suf = ` (só ${vendas} venda(s) em 30d, CAC sem base)`;
    if (cpl <= META.CPL_META)   return r("ok",      `CPL 30d R$${Math.round(cpl)} na meta${suf}`, "cpl");
    if (cpl <= META.CPL_ALARME) return r("atencao", `CPL 30d R$${Math.round(cpl)} acima da meta de R$100${suf}`, "cpl");
    return r("alarme", `CPL 30d R$${Math.round(cpl)} acima do dobro da meta${suf}`, "cpl");
  }
  return r("sem_base", `${leads} lead(s) e ${vendas} venda(s) em 30d — abaixo da base mínima`, "nenhuma");
}

function distanciaMetaPct(base, cac, cpl) {
  if (base === "cac" && cac != null) return Math.round(100 * (cac - META.CAC_ALARME) / META.CAC_ALARME);
  if (base === "cpl" && cpl != null) return Math.round(100 * (cpl - META.CPL_META) / META.CPL_META);
  return null;
}

function triar(payload) {
  const kpis = payload.kpis_por_partner_canal_janela || {};
  const tend = payload.tendencia_semanal_por_partner || {};
  const garg = payload.gargalo_funil_30d || {};
  const diasMap = payload.dias_de_dados_por_partner || {};
  const partners = payload.partners || Object.keys(kpis);
  const out = {};

  for (const p of partners) {
    const dias = diasMap[p] || 0;
    const niveis = {};
    for (const nivel of ["conta","google","meta"]) {
      const w = (kpis[p] || {})[nivel] || {};
      const j30 = w["30d"] || {}, j30p = w["30d_prev"] || {}, j7 = w["7d"] || {};
      const liq = j30.investimento_liquido || 0;
      const leads = j30.leads || 0, vendas = j30.vendas || 0;
      const cac = j30.cac ?? null, cpl = j30.cpl ?? null;
      const e = escada(liq, leads, vendas, cac, cpl, j7.leads || 0, dias);
      niveis[nivel] = {
        status: e.status, motivo: e.motivo, base_de_julgamento: e.base,
        cac_30d: cac, cpl_30d: cpl,
        cac_30d_prev: j30p.cac ?? null, cpl_30d_prev: j30p.cpl ?? null,
        leads_30d: leads, vendas_30d: vendas,
        investimento_liquido_30d: Math.round(liq),
        distancia_meta_pct: distanciaMetaPct(e.base, cac, cpl),
        pct_cashback_30d: j30.pct_cashback ?? null,
        pct_cashback_30d_prev: j30p.pct_cashback ?? null,
        cashback_subiu: (j30.pct_cashback != null && j30p.pct_cashback != null)
                        ? j30.pct_cashback > j30p.pct_cashback : null,
        // gargalo só conta onde há base: conta sem lead marca -100% em toda etapa
        gargalo_relevante: (e.base !== "nenhuma" && e.base !== "ramp")
                           ? gargaloRelevante((garg[p] || {})[nivel]) : false,
      };
    }

    const conta = niveis.conta;
    delete niveis.conta;
    const piores = Object.entries(niveis).sort((a,b) =>
      (SEV[a[1].status] - SEV[b[1].status]) || ((b[1].distancia_meta_pct||0) - (a[1].distancia_meta_pct||0)));
    const canalCritico = SEV[piores[0][1].status] <= SEV.atencao ? piores[0][0] : "nenhum";

    const dirLeads = ((((tend[p] || {}).total) || {}).leads || {}).direcao_8sem || null;
    const riscoChurn = !!(conta.cac_30d && conta.cac_30d_prev &&
                          conta.cac_30d > META.CAC_ALARME && conta.cac_30d_prev > META.CAC_ALARME &&
                          (dirLeads === "queda" || dirLeads === "estavel"));

    out[p] = {
      status_geral: conta.status, motivo: conta.motivo,
      base_de_julgamento: conta.base_de_julgamento,
      distancia_meta_pct: conta.distancia_meta_pct,
      dias_de_dados: dias, conta, canal_critico: canalCritico, canais: niveis,
      tendencia_leads_8sem: dirLeads, risco_churn: riscoChurn,
      motivo_risco_churn: riscoChurn
        ? "CAC acima de R$200 em 30d e em 30d_prev, com leads em queda ou estáveis no piso" : null,
    };
  }

  const ordem = Object.keys(out).sort((a,b) =>
    (SEV[out[a].status_geral] - SEV[out[b].status_geral]) ||
    ((out[b].distancia_meta_pct||0) - (out[a].distancia_meta_pct||0)));

  return { metas: META, ordem_de_prioridade: ordem, por_partner: out };
}

function extrairNumeros(txt) {
  const limpo = txt.replace(/<[^>]+>/g, " ");
  const found = new Set();
  const re = /(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*(?:,\d+)?|\d+(?:[.,]\d+)?)\s*%?/g;
  let m;
  while ((m = re.exec(limpo))) {
    const n = m[1].replace(/\./g, "").replace(",", ".");
    const v = parseFloat(n);
    if (!isNaN(v) && v >= 2) found.add(v);   // ignora 0 e 1 (contagem em prosa)
  }
  return found;
}

function numerosPermitidos(diag) {
  const ok = new Set();
  for (const p of diag.partners || []) {
    for (const e of p.evidencias_citadas || []) {
      const re = /(\d{1,3}(?:\.\d{3})*(?:,\d+)?|\d+(?:[.,]\d+)?)/g;
      let m;
      while ((m = re.exec(String(e.valor)))) {
        const v = parseFloat(m[1].replace(/\./g,"").replace(",","."));
        if (!isNaN(v)) { ok.add(v); ok.add(Math.round(v)); }
      }
    }
  }
  return ok;
}

function validar(payload, triagem, diag, blocos) {
  const r = [];
  const add = (lvl, msg) => r.push({ lvl, msg });
  const partnersPayload = payload.partners || Object.keys(payload.kpis_por_partner_canal_janela || {});

  // estágio 1
  add("h", "Estágio 1 — diagnóstico");
  if (!diag) { add("fail", "sem JSON de diagnóstico"); return r; }
  const nomes = (diag.partners || []).map(p => p.partner);
  const faltando = partnersPayload.filter(p => !nomes.some(n => n.toLowerCase().includes(p.toLowerCase()) || p.toLowerCase().includes(n.toLowerCase())));
  faltando.length ? add("fail", `partner ausente no diagnóstico: ${faltando.join(", ")}`)
                  : add("pass", `todos os ${partnersPayload.length} partners presentes`);

  let divergentes = [];
  for (const p of diag.partners || []) {
    const t = triagem.por_partner[p.partner] ||
              Object.entries(triagem.por_partner).find(([k]) => k.toLowerCase() === p.partner.toLowerCase())?.[1];
    if (t && t.status_geral !== p.status_geral) divergentes.push(`${p.partner}: disse "${p.status_geral}", triagem diz "${t.status_geral}"`);
  }
  divergentes.length ? add("fail", "status reclassificado pelo modelo — " + divergentes.join(" · "))
                     : add("pass", "status_geral bate com a triagem em todos os partners");

  const semEvid = (diag.partners||[]).filter(p => !(p.evidencias_citadas||[]).length).map(p=>p.partner);
  semEvid.length ? add("warn", "sem evidencias_citadas: " + semEvid.join(", "))
                 : add("pass", "todo partner declarou evidências");

  const acoesBaixa = (diag.acoes_priorizadas||[]).filter(a => a.confianca === "baixa");
  acoesBaixa.length ? add("fail", `${acoesBaixa.length} ação priorizada com confiança baixa`)
                    : add("pass", "nenhuma ação priorizada com confiança baixa");

  const churnTri = Object.entries(triagem.por_partner).filter(([,v]) => v.risco_churn).map(([k])=>k);
  const churnDiag = (diag.partners||[]).filter(p=>p.risco_churn).map(p=>p.partner);
  if (churnTri.length) {
    const perdidos = churnTri.filter(p => !churnDiag.some(d => d.toLowerCase().includes(p.toLowerCase())));
    perdidos.length ? add("fail", "risco de churn na triagem não marcado no diagnóstico: " + perdidos.join(", "))
                    : add("pass", "risco de churn propagado: " + churnTri.join(", "));
  } else add("pass", "nenhum risco de churn na triagem");

  const limites = { diagnostico:400, cadeia_causal:300, hipotese:250, como_validar:200, acao_semana:250 };
  const estouros = [];
  for (const p of diag.partners||[]) for (const [k,lim] of Object.entries(limites))
    if (p[k] && p[k].length > lim) estouros.push(`${p.partner}.${k} ${p[k].length}/${lim}`);
  estouros.length ? add("warn", "campo acima do limite: " + estouros.join(" · "))
                  : add("pass", "todos os campos dentro dos limites de tamanho");

  // estágio 2
  if (!blocos) return r;
  add("h", "Estágio 2 — redação");
  for (const b of ["pareceres","recomendacoes","leitura_portfolio","resumo_slack"])
    blocos[b] ? add("pass", `bloco <${b}> presente`) : add("fail", `bloco <${b}> ausente ou não fechou`);

  const h3 = (blocos.pareceres||"").match(/<h3/gi) || [];
  h3.length === nomes.length ? add("pass", `${h3.length} pareceres para ${nomes.length} partners`)
                             : add("fail", `${h3.length} pareceres para ${nomes.length} partners`);

  const sl = (blocos.resumo_slack||"").length;
  sl <= 700 ? add("pass", `resumo Slack com ${sl} caracteres`) : add("fail", `resumo Slack com ${sl} caracteres (limite 700)`);

  const tagsOk = /^(?:(?!<\s*\/?\s*(?!h3|p|strong|ul|li|table|thead|tbody|tr|th|td)\w+)[\s\S])*$/;
  const prosa = (blocos.pareceres||"") + (blocos.leitura_portfolio||"");
  const tagsUsadas = [...prosa.matchAll(/<\s*\/?\s*([a-zA-Z0-9]+)/g)].map(m=>m[1].toLowerCase());
  const proibidas = [...new Set(tagsUsadas.filter(t => !["h3","p","strong","ul","li","table","thead","tbody","tr","th","td"].includes(t)))];
  proibidas.length ? add("fail", "tag fora da whitelist: " + proibidas.join(", ")) : add("pass", "só tags permitidas");

  const permitidos = numerosPermitidos(diag);
  const usados = extrairNumeros((blocos.pareceres||"") + " " + (blocos.leitura_portfolio||"") + " " + (blocos.resumo_slack||""));
  const suspeitos = [...usados].filter(v => !permitidos.has(v) && !permitidos.has(Math.round(v)));
  suspeitos.length ? add("warn", `número na prosa fora de evidencias_citadas: ${suspeitos.slice(0,15).join(", ")}${suspeitos.length>15?"…":""}`)
                   : add("pass", "todo número da prosa existe em evidencias_citadas");
  return r;
}

function fmt(tpl, vals) {
  let s = tpl;
  for (const [k,v] of Object.entries(vals)) s = s.split("{"+k+"}").join(v);
  return s;
}

async function callLLM(prompt, mode) {
  const provider = $("provider").value, model = $("model").value.trim(), key = $("apikey").value.trim();
  if (provider === "gemini") {
    const cfg = { temperature: 0.4, maxOutputTokens: 65536 };
    if (mode === "json") { cfg.responseMimeType = "application/json"; cfg.responseSchema = STAGE1_SCHEMA; }
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method:"POST", headers:{ "Content-Type":"application/json", "x-goog-api-key":key },
      body: JSON.stringify({ contents:[{parts:[{text:prompt}]}], generationConfig: cfg }),
    });
    const j = await resp.json();
    if (!resp.ok) throw new Error(`Gemini ${resp.status}: ${j.error?.message || JSON.stringify(j)}`);
    return (j.candidates?.[0]?.content?.parts || []).map(p=>p.text||"").join("");
  }
  if (provider === "openai") {
    const body = { model, temperature:0.4, messages:[{role:"user",content:prompt}] };
    if (mode === "json") body.response_format = { type:"json_object" };
    const resp = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${key}` }, body: JSON.stringify(body) });
    const j = await resp.json();
    if (!resp.ok) throw new Error(`OpenAI ${resp.status}: ${j.error?.message || JSON.stringify(j)}`);
    return j.choices[0].message.content;
  }
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{ "Content-Type":"application/json", "x-api-key":key,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model, max_tokens:16384, temperature:0.4, messages:[{role:"user",content:prompt}] }) });
  const j = await resp.json();
  if (!resp.ok) throw new Error(`Anthropic ${resp.status}: ${j.error?.message || JSON.stringify(j)}`);
  return (j.content||[]).map(b=>b.text||"").join("");
}

function parseJSONLoose(text) {
  let t = text.trim().replace(/^```(?:json)?\s*|\s*```$/g, "");
  const s = t.indexOf("{"), e = t.lastIndexOf("}");
  if (s === -1 || e <= s) throw new Error("resposta sem JSON reconhecível (truncada?) — " + t.length + " chars");
  return JSON.parse(t.slice(s, e+1));
}

function parseBlocos(text) {
  const out = {};
  for (const tag of ["pareceres","recomendacoes","leitura_portfolio","resumo_slack"]) {
    const m = text.match(new RegExp(`<${tag}>([\\s\\S]*?)</${tag}>`, "i"));
    if (m) out[tag] = m[1].trim();
  }
  return Object.keys(out).length ? out : null;
}

      return `<span class="${k}">${x.status}</span><br><span style="font-size:.72rem;opacity:.75">${v}${x.gargalo_relevante?" · gargalo":""}</span>`;
    };
    return `<tr><td><strong>${esc(p)}</strong></td><td class="${cls}">${t.status_geral}</td>
      <td>${cel("google")}</td><td>${cel("meta")}</td>

    <th>Motivo</th></tr></thead><tbody>${rows}</tbody></table>`;

    h2:first-child{margin-top:0} h3{font-size:.9rem;margin:14px 0 2px}
    table{border-collapse:collapse;width:100%;font-size:.78rem;margin:10px 0}
    th,td{border:1px solid #dde2e8;padding:5px 8px;text-align:left;vertical-align:top} th{background:#eaf2fc}
    @media (prefers-color-scheme:dark){body{color:#e6e9ef}h2{border-color:#2b323e}
    th,td{border-color:#2b323e}th{background:#1c2c47}}`;
  const html = `<h2>Leitura do Portfólio</h2>${blocos.leitura_portfolio||""}
    <h2>Parecer por Partner</h2>${blocos.pareceres||""}
    <h2>Recomendações</h2>${blocos.recomendacoes||""}`;
  const clean = html.replace(/<\s*\/?\s*(script|style|iframe|link|meta)\b[^>]*>/gi, "");
  const f = document.createElement("iframe");
  f.setAttribute("sandbox","");
  f.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><style>${style}</style></head><body>${clean}</body></html>`;
  $("o-rel").innerHTML = ""; $("o-rel").appendChild(f);
}

function renderChecks(res) {
  const html = res.map(r => r.lvl === "h" ? `<h4>${esc(r.msg)}</h4>`
    : `<div class="${r.lvl==="fail"?"fail":r.lvl==="warn"?"warn":"pass"}">${esc(r.msg)}</div>`).join("");
  setPane("o-chk", `<div class="chk">${html}</div>`);
}

async function run(fullChain) {
  const key = $("apikey").value.trim();
  if (!key) { statusEl.textContent="Cole uma API key primeiro."; statusEl.className="status error"; return; }
  let payload;
  try { payload = JSON.parse(payEl.value); }
  catch (e) { statusEl.textContent="Payload não é JSON válido: "+e.message; statusEl.className="status error"; return; }

  ["s0","s1","s2","sv"].forEach(s=>step(s,""));
  $("runBtn").disabled = $("run1Btn").disabled = true;
  statusEl.className = "status";
  const t0 = performance.now();
  const cover = (payload.data_corte || "").slice(0,10);
  const prev = prevEl.value.trim() || "[]  (primeira semana — sem diagnóstico anterior)";

  try {
    // ── estágio 0
    step("s0","run");
    statusEl.innerHTML = '<span class="spinner"></span> estágio 0 — triagem…';
    const tri = triar(payload);
    payload.triagem = tri;
    setPane("o-tri", renderTriagem(tri));
    show("o-tri");
    step("s0","done");

    // ── estágio 1
    step("s1","run");
    statusEl.innerHTML = '<span class="spinner"></span> estágio 1 — diagnóstico…';
    const p1 = fmt(e1El.value, { cover, payload: JSON.stringify(payload), diagnostico_anterior: prev });
    $("finalPrompt").textContent = p1;
    $("finalPrompt").className = "";
    const raw1 = await callLLM(p1, "json");
    const diag = parseJSONLoose(raw1);
    setPane("o-diag", "<pre>"+esc(JSON.stringify(diag,null,2))+"</pre>");
    localStorage.setItem("pg2_last_diag", JSON.stringify(diag,null,2));
    step("s1","done");
    show("o-diag");

    let blocos = null, raw2 = "";
    if (fullChain) {
      // ── estágio 2
      step("s2","run");
      statusEl.innerHTML = '<span class="spinner"></span> estágio 2 — redação…';
      const p2 = fmt(e2El.value, { cover, diagnostico_json: JSON.stringify(diag), diagnostico_anterior: prev });
      raw2 = await callLLM(p2, "text");
      blocos = parseBlocos(raw2);
      if (!blocos) throw new Error("estágio 2 não devolveu os blocos XML esperados");
      renderRelatorio(blocos);
      setPane("o-slack", "<pre>"+esc(blocos.resumo_slack||"")+"</pre>");
      step("s2","done");
      show("o-rel");
    }

    step("sv","run");
    renderChecks(validar(payload, tri, diag, blocos));
    step("sv","done");
    setPane("o-raw", "<pre>"+esc("── ESTÁGIO 1 ──\n"+raw1+(raw2?"\n\n── ESTÁGIO 2 ──\n"+raw2:""))+"</pre>");

    const dt = ((performance.now()-t0)/1000).toFixed(1);
    statusEl.textContent = `OK em ${dt}s · prompt e1: ${p1.length.toLocaleString("pt-BR")} chars · diagnóstico: ${raw1.length.toLocaleString("pt-BR")} chars`
      + (raw2 ? ` · relatório: ${raw2.length.toLocaleString("pt-BR")} chars` : "");
  } catch (e) {
    ["s0","s1","s2","sv"].forEach(s => { if ($(s).className === "run") step(s,"fail"); });
    statusEl.textContent = "Erro: " + e.message;
    statusEl.className = "status error";
  } finally {
    $("runBtn").disabled = $("run1Btn").disabled = false;
  }
}

$("runBtn").addEventListener("click", () => run(true));
$("run1Btn").addEventListener("click", () => run(false));
loadInitial();
</script>
</body>
</html>
